<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome Bridge</title>
<link rel="stylesheet" href="style.css">
<style>
main{max-width:520px;margin:34px auto;padding:18px}
.actions{display:flex;gap:12px;margin:24px 0}
.actions button{flex:1;min-height:52px;font-weight:700;font-size:16px}
#status{font-weight:600}
#detail{overflow-wrap:anywhere;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Chrome Bridge</h1>
  <p id="status" role="status" aria-live="polite">Проверка соединения…</p>
  <div class="actions">
    <button id="connect" type="button">Подключить</button>
    <button id="disconnect" type="button" class="secondary">Отключить</button>
  </div>
  <p id="detail" class="hint" role="status"></p>
  <p class="hint">Подключение предоставляет доступ к обычным открытым и новым веб-вкладкам.
  Chrome может один раз запросить разрешение на сайты. Служебные страницы Chrome недоступны.
  Локально сохранённый ключ не отображается и не передаётся веб-страницам.</p>
</main>
<script type="module" src="one-click-control.js"></script>
</body>
</html>
