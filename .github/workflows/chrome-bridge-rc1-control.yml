name: Chrome Bridge RC1 Control Gates
on:
  push:
    branches:
      - release/chrome-bridge-v0.2.0-background-rc1
  pull_request:
    paths:
      - 'docs/chrome-bridge-handoff/chrome-bridge-v20/**'
      - '.github/workflows/chrome-bridge-rc1-control.yml'
permissions:
  contents: read
jobs:
  control-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check RC1 modules
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          node --check extension/control-targets.js
          node --check extension/control-ui-guard.js
          node --check extension/background-control-ui-state.js
          node --check extension/control.js
          node --check tests/control-tab-url-guard.test.mjs
          node --check extension/coordinator-ack.js
          node --check extension/background-mode-reconnect.js
      - name: Validate release package assembler PowerShell syntax
        shell: pwsh
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'deployment/build-rc-final-lab-package.ps1'),
            [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Independent RC1 regression matrix
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          node --test tests/control-tab-url-guard.test.mjs
          node --test tests/control-ui-single-entry.test.mjs tests/background-mode-reconnect.test.mjs tests/coordinator-ack.test.mjs tests/control-targets.test.mjs tests/background-control-ui-state.test.mjs tests/control-ui-guard.test.mjs tests/background-control-grants.test.mjs tests/background-readonly-security.test.mjs tests/transport-recovery-security.test.mjs
