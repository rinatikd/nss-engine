name: Windows Broker v0.12 native compile only

on:
  push:
    branches:
      - agent/chatgpt/40-windows-broker-v12
    paths:
      - 'tools/chrome-bridge-windows-broker-v12/**'
      - '.github/workflows/windows-broker-v12-native-compile.yml'
  pull_request:
    paths:
      - 'tools/chrome-bridge-windows-broker-v12/**'
      - '.github/workflows/windows-broker-v12-native-compile.yml'

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile native source without executing it
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'BLOCKED: vswhere.exe not found' }
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'BLOCKED: Visual C++ x64 tools not found' }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd)) { throw 'BLOCKED: VsDevCmd.bat not found' }

          $package = Join-Path $env:GITHUB_WORKSPACE 'tools\chrome-bridge-windows-broker-v12'
          $buildScript = Join-Path $package 'tests\build-native.ps1'
          if (-not (Test-Path -LiteralPath $buildScript)) { throw 'BLOCKED: compile script missing' }

          $batch = Join-Path $env:RUNNER_TEMP 'cb-v12-compile-only.cmd'
          @"
          @echo off
          call "$devCmd" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -File "$buildScript"
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $batch -Encoding ascii

          & $env:ComSpec /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw "Compile-only validation failed: $LASTEXITCODE" }
          Write-Host 'PASS: source compiled. No native executable was launched.'
