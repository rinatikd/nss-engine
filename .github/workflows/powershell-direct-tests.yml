name: PowerShell Direct tests

on:
  pull_request:
    paths:
      - "tools/powershell-direct/**"
      - ".github/workflows/powershell-direct-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check tools/powershell-direct/runner.mjs
          node --check tools/powershell-direct/service.mjs
          node --check tools/powershell-direct/approval-proxy.mjs
          node --check tools/powershell-direct/stack-supervisor.mjs
      - name: PowerShell Direct unit and HTTP tests
        run: node --test tools/powershell-direct/tests/service.test.mjs

  windows-job-object-poc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run native operation state tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /DUNICODE /D_UNICODE tools/powershell-direct/native/test-operation-state.cpp /Fe:build/test-operation-state.exe
          if ($LASTEXITCODE -ne 0) { throw "Operation state test compilation failed: $LASTEXITCODE" }
          & .\build\test-operation-state.exe
          if ($LASTEXITCODE -ne 0) { throw "Operation state tests failed: $LASTEXITCODE" }
      - name: Compile and run synchronized operation state tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /DUNICODE /D_UNICODE tools/powershell-direct/native/test-synchronized-operation-state.cpp /Fe:build/test-synchronized-operation-state.exe
          if ($LASTEXITCODE -ne 0) { throw "Synchronized operation state test compilation failed: $LASTEXITCODE" }
          & .\build\test-synchronized-operation-state.exe
          if ($LASTEXITCODE -ne 0) { throw "Synchronized operation state tests failed: $LASTEXITCODE" }
      - name: Compile and run shared operation registry tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /DUNICODE /D_UNICODE /permissive- tools/powershell-direct/native/test-operation-registry.cpp /Fe:build/test-operation-registry.exe
          if ($LASTEXITCODE -ne 0) { throw "Operation registry test compilation failed: $LASTEXITCODE" }
          & .\build\test-operation-registry.exe
          if ($LASTEXITCODE -ne 0) { throw "Operation registry tests failed: $LASTEXITCODE" }
      - name: Compile native Job Object proof of concept
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /DUNICODE /D_UNICODE tools/powershell-direct/native/job-object-poc.cpp /Fe:build/job-object-poc.exe
          if ($LASTEXITCODE -ne 0) { throw "MSVC compilation failed: $LASTEXITCODE" }
      - name: Run descendant containment and termination smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build\job-object-poc.exe
          if ($LASTEXITCODE -ne 0) { throw "Job Object smoke test failed: $LASTEXITCODE" }

  windows-native-addon:
    # node-gyp 11 does not reliably identify the VS 18 / VS 2026
    # installation on the hosted image yet. Use the supported VS 2022
    # image for this native build until upstream detection catches up.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build N-API addon
        working-directory: tools/powershell-direct/native
        shell: pwsh
        env:
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes node-gyp@11.2.0 rebuild
          if ($LASTEXITCODE -ne 0) { throw "Native addon build failed: $LASTEXITCODE" }
      - name: Load addon and verify ABI metadata
        working-directory: tools/powershell-direct/native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node test-load.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native addon load test failed: $LASTEXITCODE" }
