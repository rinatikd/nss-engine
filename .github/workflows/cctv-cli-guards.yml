name: CCTV CLI input and output guards
on:
  push:
    branches: [agent/chatgpt/cctv-m2-input-guard]
  pull_request:
    paths:
      - 'work/NSS_TKK_Editor_v0.2/modules/cctv/**'
      - '.github/workflows/cctv-cli-guards.yml'
permissions:
  contents: read
jobs:
  cli-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CCTV CLI guard and end-to-end tests
        run: python -m unittest discover -s work/NSS_TKK_Editor_v0.2/modules/cctv/tests -p 'test_cli_*.py' -v
      - name: Run CCTV core tests
        run: python -m unittest discover -s work/NSS_TKK_Editor_v0.2/modules/cctv -p 'test_cctv_core.py' -v
      - name: Compile Python module
        run: python -m py_compile work/NSS_TKK_Editor_v0.2/modules/cctv/cctv_cli.py
