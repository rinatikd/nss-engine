name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/repo_guard.py --tree HEAD
      - run: python tools/run_portable_checks.py

  windows-release-helper-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PR132 staging and native identity helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            'tools/powershell-direct/Prepare-PR132ReleaseCandidate.ps1',
            'tools/powershell-direct/Inspect-PR132LabIdentity.ps1',
            'tools/powershell-direct/Diagnose-PR132GitCapture.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $file),
              [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($file + ': ' + ($errors | Out-String)) }
            Write-Output ('[PASS] PowerShell 5.1 parse: ' + $file)
          }
