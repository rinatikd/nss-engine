name: Chrome Bridge Visual RC
on:
  push:
    branches: [agent/chatgpt/visual-debug-01]
  pull_request:
    paths:
      - 'docs/chrome-bridge-handoff/chrome-bridge-v20/**'
      - '.github/workflows/chrome-bridge-visual-rc.yml'
permissions:
  contents: read
jobs:
  node-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run visual snapshot and grant tests
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: node --test tests/visual-snapshot.test.mjs tests/permissions-adapters.test.mjs tests/control-approval.test.mjs tests/manifest-rc.test.mjs tests/browser-key-store.test.mjs tests/connection-check.test.mjs tests/transport-engine.test.mjs tests/background-worker.test.mjs tests/background-coordinator.test.mjs tests/read-only-dispatch.test.mjs tests/approval-broker.test.mjs tests/approval-session.test.mjs tests/mutation-dispatch.test.mjs tests/background-control-grants.test.mjs
      - name: Verify MCP handshake independently of browser availability
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: node --test tests/mcp-channel-smoke.test.mjs
      - name: Verify read-only MCP route diagnostic safety and native Windows test when available
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: node --test tests/diagnose-mcp-link.test.mjs
      - name: Syntax check changed extension files
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          node --check extension/control.js
          node --check extension/visual-snapshot.js
          node --check extension/permissions.js
          node --check server/tools.mjs
          node --check extension/browser-key-store.js
          node --check extension/background.js
          node --check extension/connection-check.js
          node --check extension/transport-engine.js
          node --check extension/transport-worker.js
          node --check extension/transport-host.js
          node --check extension/read-only-dispatch.js
          node --check extension/background-coordinator.js
          node --check extension/approval-broker.js
          node --check extension/approval-session.js
          node --check extension/mutation-dispatch.js
          node --check extension/background-control-grants.js
      - name: Read-only Windows preflight with synthetic manifest
        shell: pwsh
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'chrome-bridge-fixture'
          $ext = Join-Path $fixture 'extension'
          New-Item -ItemType Directory -Path $ext -Force | Out-Null
          Copy-Item extension/background.js,extension/control.js,extension/control.html,extension/permissions.js -Destination $ext
          $manifest = @{ manifest_version = 3; version = '0.2.0'; permissions = @('storage','scripting','activeTab'); host_permissions = @('http://127.0.0.1/*'); background = @{service_worker = 'background.js'} }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $ext 'manifest.json') -Encoding UTF8
          & ./deployment/preflight-windows.ps1 -BridgeRoot $fixture -SkipPorts
          if ($LASTEXITCODE -ne 0) { throw "Read-only preflight returned $LASTEXITCODE" }
      - name: Test Windows upgrade dry-run apply and rollback on synthetic extension
        shell: pwsh
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'chrome-bridge-upgrade-fixture'
          $installed = Join-Path $root 'extension'
          New-Item -ItemType Directory -Force -Path $installed | Out-Null
          Copy-Item extension/background.js,extension/control.js,extension/control.html,extension/permissions.js -Destination $installed
          $m = @{
            manifest_version = 3
            version = '0.2.0'
            permissions = @('storage','scripting')
            host_permissions = @('http://127.0.0.1/*')
            optional_host_permissions = @('https://*/*')
            background = @{ service_worker = 'background.js' }
            action = @{ default_title = 'Chrome Bridge' }
          }
          $m | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $installed 'manifest.json') -Encoding UTF8
          $originalHash = (Get-FileHash (Join-Path $installed 'manifest.json')).Hash
          & ./deployment/upgrade-windows.ps1 -BridgeRoot $root -CandidateRoot .
          if ($LASTEXITCODE -ne 0) { throw 'dry-run failed' }
          if ((Get-FileHash (Join-Path $installed 'manifest.json')).Hash -ne $originalHash) { throw 'Dry-run changed manifest' }
          & ./deployment/upgrade-windows.ps1 -BridgeRoot $root -CandidateRoot . -Apply
          if ($LASTEXITCODE -ne 0) { throw 'apply failed' }
          $updated = Get-Content -LiteralPath (Join-Path $installed 'manifest.json') -Raw | ConvertFrom-Json
          if (@($updated.permissions) -notcontains 'activeTab') { throw 'Permission not installed' }
          if ($updated.background.type -ne 'module') { throw 'Module worker not installed' }
          if (@($updated.permissions) -notcontains 'offscreen') { throw 'Offscreen missing' }
          if (@($updated.permissions) -notcontains 'alarms') { throw 'Alarm missing' }
          if (@($updated.optional_host_permissions) -notcontains 'https://*/*') { throw 'Optional hosts changed' }
          if (@($updated.host_permissions) -contains '<all_urls>') { throw 'Broad host access introduced' }
          if (-not (Test-Path (Join-Path $installed 'browser-key-store.js'))) { throw 'Key-store module missing' }
          if (-not (Test-Path (Join-Path $installed 'connection-check.js'))) { throw 'Credential check module missing' }
          if (-not (Test-Path (Join-Path $installed 'style.css'))) { throw 'Stylesheet missing' }
          if ((Get-Content (Join-Path $installed 'style.css') -Raw) -notmatch 'max-width:940px') { throw 'New styles not deployed' }
          $backups = @(Get-ChildItem (Split-Path $root -Parent) -Directory -Filter 'chrome-bridge-backup-*' | Sort-Object LastWriteTime -Descending)
          if (-not $backups.Count) { throw 'Backup not found' }
          & ./deployment/upgrade-windows.ps1 -BridgeRoot $root -RollbackFrom $backups[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'rollback failed' }
          if ((Get-FileHash (Join-Path $installed 'manifest.json')).Hash -ne $originalHash) { throw 'Rollback did not restore manifest' }
          if (Test-Path (Join-Path $installed 'browser-key-store.js')) { throw 'Rollback kept new source file' }
          Write-Output '[PASS] staged dry-run, backup, apply, and rollback'


  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test staged upgrade and rollback with native Windows PowerShell 5.1
        shell: powershell
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'chrome-bridge-ps51-fixture'
          $installed = Join-Path $root 'extension'
          New-Item -ItemType Directory -Force -Path $installed | Out-Null
          Copy-Item extension/background.js,extension/control.js,extension/control.html,extension/permissions.js -Destination $installed
          $m = @{
            manifest_version = 3
            version = '0.2.0'
            permissions = @('storage','scripting')
            host_permissions = @('http://127.0.0.1/*')
            optional_host_permissions = @('https://*/*')
            background = @{ service_worker = 'background.js' }
            action = @{ default_title = 'Chrome Bridge' }
          }
          $manifestPath = Join-Path $installed 'manifest.json'
          [IO.File]::WriteAllText($manifestPath, ($m | ConvertTo-Json -Depth 20), (New-Object System.Text.UTF8Encoding($false)))
          $originalHash = (Get-FileHash $manifestPath).Hash
          & ./deployment/upgrade-windows.ps1 -BridgeRoot $root -CandidateRoot .
          if ($LASTEXITCODE -ne 0) { throw 'Dry run failed' }
          if ((Get-FileHash $manifestPath).Hash -ne $originalHash) { throw 'Dry run modified manifest' }
          & ./deployment/upgrade-windows.ps1 -BridgeRoot $root -CandidateRoot . -Apply
          if ($LASTEXITCODE -ne 0) { throw 'Apply failed' }
          $bytes = [IO.File]::ReadAllBytes($manifestPath)
          if (($bytes.Length -gt 2) -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191) { throw 'UTF-8 BOM added to Chrome manifest' }
          $updated = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (@($updated.permissions) -notcontains 'activeTab') { throw 'activeTab missing' }
          if ($updated.background.type -ne 'module') { throw 'MV3 module background missing' }
          if (@($updated.permissions) -notcontains 'offscreen') { throw 'offscreen permission missing' }
          if (@($updated.permissions) -notcontains 'alarms') { throw 'alarms permission missing' }
          if (-not (Test-Path (Join-Path $installed 'transport-host.html'))) { throw 'Background host missing' }
          if (-not (Test-Path (Join-Path $installed 'connection-check.js'))) { throw 'Credential check module missing' }
          if (-not (Test-Path (Join-Path $installed 'style.css'))) { throw 'Stylesheet missing' }
          if ((Get-Content (Join-Path $installed 'style.css') -Raw) -notmatch 'max-width:940px') { throw 'New styles not deployed' }
          $backups = @(Get-ChildItem (Split-Path $root -Parent) -Directory -Filter 'chrome-bridge-backup-*' | Sort-Object LastWriteTime -Descending)
          if ($backups.Count -ne 1) { throw 'Expected exactly one rollback backup' }
          & ./deployment/upgrade-windows.ps1 -BridgeRoot $root -RollbackFrom $backups[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rollback failed' }
          if ((Get-FileHash $manifestPath).Hash -ne $originalHash) { throw 'Manifest not restored exactly' }
          if (Test-Path (Join-Path $installed 'browser-key-store.js')) { throw 'New file survived rollback' }
          Write-Output '[PASS] Windows PowerShell 5.1 dry-run/apply/restore with BOM check'
      - name: Test supervisor probe and scheduled-task dry-run on Windows
        shell: powershell
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'chrome-bridge-watchdog-fixture'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'Start-Bridge.ps1') -Value "Write-Output 'synthetic-launcher'"
          $taskName = 'ChromeBridge-Server-17381'
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) { throw 'Unexpected task exists on CI runner' }
          $plan = & ./deployment/register-watchdog.ps1 -BridgeRoot $root
          if ($LASTEXITCODE -ne 0 -or (($plan -join ' ') -notmatch '\[DRY-RUN\]')) { throw 'Task setup dry-run failed' }
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) { throw 'Dry-run unexpectedly registered a task' }
          $probe = & ./deployment/watch-bridge.ps1 -BridgeRoot $root -ProbeOnly
          if ($LASTEXITCODE -notin @(0,2)) { throw 'Probe returned an unexpected status' }
          if ((($probe -join ' ') -notmatch '\[(READY|DOWN)\]')) { throw 'Probe produced invalid status' }
          $rm = & ./deployment/register-watchdog.ps1 -BridgeRoot $root -Remove
          if ((($rm -join ' ') -notmatch '\[DRY-RUN\]')) { throw 'Removal dry-run failed' }
          Write-Output '[PASS] No startup settings changed during watchdog preflight'
      - name: Verify no-secret MCP link diagnostic on Windows PowerShell 5.1
        shell: powershell
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          node --test tests/diagnose-mcp-link.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MCP link diagnostic failed' }
      - name: Stage separate MV3 background lab manifest safely
        shell: powershell
        working-directory: docs/chrome-bridge-handoff/chrome-bridge-v20
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'chrome-bridge-background-installed'
          $out = Join-Path $env:RUNNER_TEMP 'chrome-bridge-background-lab'
          New-Item -Path (Join-Path $root 'extension') -ItemType Directory -Force | Out-Null
          $installed = Join-Path $root 'extension'
          Copy-Item extension/background.js -Destination $installed
          $m = @{
            manifest_version = 3
            version = '0.2.1'
            permissions = @('storage','scripting')
            host_permissions = @('http://127.0.0.1/*')
            background = @{service_worker='background.js'}
          }
          [IO.File]::WriteAllText((Join-Path $installed 'manifest.json'),($m | ConvertTo-Json -Depth 10),(New-Object System.Text.UTF8Encoding($false)))
          $dry = & ./deployment/stage-background-lab.ps1 -BridgeRoot $root -CandidateRoot . -OutputRoot $out
          if ((($dry -join ' ') -notmatch '\[DRY-RUN\]') -or (Test-Path $out)) { throw 'Lab dry run changed files' }
          & ./deployment/stage-background-lab.ps1 -BridgeRoot $root -CandidateRoot . -OutputRoot $out -Apply
          if ($LASTEXITCODE -ne 0) { throw 'Lab stage failed' }
          $labManifest = Get-Content (Join-Path $out 'manifest.json') -Raw | ConvertFrom-Json
          if ($labManifest.background.type -ne 'module') { throw 'Module worker not enabled' }
          if (@($labManifest.permissions) -notcontains 'offscreen') { throw 'Offscreen permission missing' }
          if (@($labManifest.permissions) -notcontains 'alarms') { throw 'Alarms permission missing' }
          if ((Get-Content (Join-Path $installed 'manifest.json') -Raw | ConvertFrom-Json).background.type) { throw 'Installed manifest modified' }
          if (-not (Test-Path (Join-Path $out 'transport-worker.js'))) { throw 'Worker missing' }
          Write-Output '[PASS] MV3 background lab prepared without modifying the installed extension'
      - name: Package source-only Windows upgrade candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-bridge-rc-windows-upgrade
          path: |
            docs/chrome-bridge-handoff/chrome-bridge-v20/extension/
            docs/chrome-bridge-handoff/chrome-bridge-v20/deployment/
          if-no-files-found: error
          retention-days: 7
