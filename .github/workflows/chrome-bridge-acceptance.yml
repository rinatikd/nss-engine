name: Chrome Bridge acceptance

on:
  push:
    branches: ['agent/codex/chrome-bridge-rc1']
    paths:
      - 'tools/chrome-bridge-rc1/**'
      - '.github/workflows/chrome-bridge-acceptance.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'tools/chrome-bridge-rc1/**'
      - '.github/workflows/chrome-bridge-acceptance.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  kit:
    name: Source acceptance (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CHROME_BRIDGE_NATIVE_V07: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Select isolated candidate directory
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/chrome-bridge-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
        run: printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR" >> "$GITHUB_ENV"
      # Only allowlisted original sources and the overlay are reconstructed.
      # Native isolation and real provider acceptance remain outside this CI.
      - name: Test updater and source builder with synthetic fixtures
        run: node --test tools/chrome-bridge-rc1/apply-update.test.mjs tools/chrome-bridge-rc1/build-source-candidate.test.mjs
      - name: Verify source inventories, SHA256, provenance, and JavaScript syntax
        run: node tools/chrome-bridge-rc1/check-package.mjs
      - name: Reconstruct source-only candidate without the original ZIP
        id: reconstruct
        run: node tools/chrome-bridge-rc1/build-source-candidate.mjs --output "$CANDIDATE_DIR"
      - name: Run full candidate Node test suite
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: node "$GITHUB_WORKSPACE/tools/chrome-bridge-rc1/ci-diagnostics.mjs" node-tests
      - name: Run isolated Windows setup and preview wrappers
        if: always() && runner.os == 'Windows' && steps.reconstruct.outcome == 'success'
        shell: powershell
        run: ./tools/chrome-bridge-rc1/windows-smoke.ps1
      - name: Parse PowerShell scripts without executing them
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(Get-ChildItem -LiteralPath tools/chrome-bridge-rc1/overlay -Filter '*.ps1' -Recurse -File)
          $scripts += @(Get-Item -LiteralPath tools/chrome-bridge-rc1/windows-smoke.ps1)
          if ($scripts.Count -ne 6) { throw "Expected 6 PowerShell scripts, found $($scripts.Count)" }
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell syntax failed: $($script.Name)"
            }
            Write-Host "Parsed $($script.Name)"
          }
          Write-Host "Parsed $($scripts.Count) PowerShell scripts without executing them."

  synthetic-mv3:
    name: Synthetic MV3 browser acceptance (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CHROME_BRIDGE_NATIVE_V07: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select isolated candidate directory
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/chrome-bridge-mv3-${{ github.run_id }}-${{ github.run_attempt }}
        run: printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR" >> "$GITHUB_ENV"
      - name: Verify checked-in source provenance
        run: node tools/chrome-bridge-rc1/check-package.mjs
      - name: Reconstruct isolated source-only candidate
        run: node tools/chrome-bridge-rc1/build-source-candidate.mjs --output "$CANDIDATE_DIR"
      - name: Install pinned Playwright dependency
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium and Linux dependencies
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: npx --no-install playwright install --with-deps chromium
      # Fresh temporary profile; all HTTPS page requests are routed to local
      # synthetic DOM fixtures by the test. No user sessions or provider APIs.
      - name: Run synthetic three-origin Chrome extension lifecycle
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: node "$GITHUB_WORKSPACE/tools/chrome-bridge-rc1/ci-diagnostics.mjs" synthetic-mv3

  package-source:
    name: Package accepted source candidate
    needs: [kit, synthetic-mv3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select clean package directory
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/chrome-bridge-package-${{ github.run_id }}-${{ github.run_attempt }}
        run: printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR" >> "$GITHUB_ENV"
      # Build afresh after acceptance so test state, browser profiles and npm
      # dependencies cannot enter the downloadable source artifact.
      - name: Reconstruct clean allowlisted source candidate
        run: node tools/chrome-bridge-rc1/build-source-candidate.mjs --output "$CANDIDATE_DIR"
      - name: Upload accepted source candidate
        uses: actions/upload-artifact@v4
        with:
          name: Chrome-Bridge-0.2.1-rc.2-source
          path: ${{ env.CANDIDATE_DIR }}/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
